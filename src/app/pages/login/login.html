<div class="login-container">
  <h2>Bienvenido a Hotelink</h2>
  
  <div class="card">
    <form (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="nombre">Usuario:</label>
        <input type="text" id="nombre" name="nombre" [(ngModel)]="loginData.nombre" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" [(ngModel)]="loginData.password" required>
      </div>

      <p *ngIf="mensajeError" class="error">{{ mensajeError }}</p>

      <button type="submit">Iniciar Sesión</button>

      <div style="margin-top: 20px; text-align: center; border-top: 1px solid #eee; padding-top: 15px;">
        <p style="margin-bottom: 10px;">¿Aún no tienes cuenta?</p>
        <button (click)="irAlRegistro()" style="padding: 8px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%;">
          Regístrate aquí
        </button>
      </div>
    </form>
  </div>
</div>
