<div class="login-container" style="max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
  <h2 style="text-align: center; color: #333;">Crear Nueva Cuenta</h2>

  <div *ngIf="mensajeError" style="color: red; margin-bottom: 10px; text-align: center;">{{ mensajeError }}</div>
  <div *ngIf="mensajeExito" style="color: green; margin-bottom: 10px; text-align: center; font-weight: bold;">{{ mensajeExito }}</div>

  <form (ngSubmit)="onSubmit()" #registerForm="ngForm" style="display: flex; flex-direction: column; gap: 15px;">
    
    <div>
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" name="nombre" [(ngModel)]="registroData.nombre" required style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
    </div>

    <div>
      <label for="email">Correo electrónico (Email):</label>
      <input type="email" id="email" name="email" [(ngModel)]="registroData.email" required style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
    </div>

    <div>
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" [(ngModel)]="registroData.password" required style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
    </div>

    <button type="submit" [disabled]="!registerForm.valid" style="padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Registrarme
    </button>
  </form>

  <div style="margin-top: 15px; text-align: center;">
    <button (click)="volverAlLogin()" style="background: none; border: none; color: #007bff; text-decoration: underline; cursor: pointer;">
      Volver al Login
    </button>
  </div>
</div>
