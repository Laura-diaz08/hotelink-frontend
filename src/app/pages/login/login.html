<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Bienvenido a Hotelink</h2>
    <p>Inicia sesión para continuar</p>

    <div *ngIf="mensajeError" class="alert error">{{ mensajeError }}</div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-grupo">
        <label>Usuario</label>
        <input type="text" name="nombre" [(ngModel)]="loginData.nombre" required placeholder="Tu nombre de usuario">
      </div>

      <div class="form-grupo">
        <label>Contraseña</label>
        <input type="password" name="password" [(ngModel)]="loginData.password" required placeholder="Tu contraseña">
      </div>

      <button type="submit" class="btn-auth">
        Iniciar sesión
      </button>

      <a routerLink="/recuperar" class="btn-volver" style="margin-top: 8px;">
        ¿Olvidaste tu contraseña?
      </a>
    </form>

    <div class="auth-footer">
      <p>¿Aún no tienes cuenta?</p>
      <button (click)="irAlRegistro()" class="btn-secundario">
        Regístrate aquí
      </button>
    </div>
  </div>
</div>
